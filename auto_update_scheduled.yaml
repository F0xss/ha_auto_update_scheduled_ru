####################################################################################################
#####                        Home Assistant Auto-update on Schedule                            #####
#####             Repository: https://github.com/edwardtfn/ha_auto_update_scheduled            #####
####################################################################################################
##### Purpose: YAML blueprint to automatically update Home Assistant and its components when   #####
#####          updates are available, following a schedule and with configurable options.      #####
####################################################################################################
##### Author: edwardtfn - https://github.com/edwardtfn - https://buymeacoffee.com/edwardfirmo  #####
##### Перевод: F0xss - https://github.com/F0xss                                                #####                                             
####################################################################################################
##### NOTE:                                                                                    #####
##### - Home Assistant may restart automatically as part of the update process.                #####
##### - Use under your own risk! Please review Home Assistant community discussions about      #####
#####   the risks involved in auto-updating the system.                                        #####
##### - SECURITY WARNING:                                                                      #####
#####   - Ensure you have reliable backups before enabling automatic updates                   #####
#####   - Auto-updates in production environments may lead to system instability               #####
#####   - Updates may affect connected devices and integrations                                #####
##### - For discussions:                                                                       #####
#####     https://community.home-assistant.io/t/459281                                         #####
##### - For support, bug reports and new ideas:                                                #####
#####     https://github.com/edwardtfn/ha_auto_update_scheduled/issues                         #####
####################################################################################################
---
blueprint:
  name: Автоматическое обновление Home Assistant по расписанию, база v2026.6.0
  author: Edward Firmo (https://github.com/edwardtfn)
  homeassistant:
    min_version: 2025.8.0
  description: "# Автоматическое обновление Home Assistant\nАвтоматически обновлять Home Assistant при
    появлении нового обновления.\n## v2026.6.0\n## Внимание:\n- Home Assistant может автоматически
    перезапуститься в рамках процесса обновления.\n- **Используйте на свой страх и риск!**
    Ознакомьтесь с обсуждениями в сообществе Home Assistant о рисках автоматического обновления
    системы.\n- Перед включением автоматических обновлений убедитесь в наличии надёжных резервных
    копий.\n- Автоматические обновления в рабочих средах могут привести к нестабильности
    системы.\n- Обновления могут повлиять на подключённые устройства и интеграции.\n## Для
    обсуждения:\n  - [Портал сообщества Home Assistant](https://community.home-assistant.io/t/459281)\n\n##
    Поддержка, сообщения об ошибках и новые идеи:\n  - [GitHub Issues](https://github.com/edwardtfn/ha_auto_update_scheduled/issues)\n"
  domain: automation
  source_url: https://raw.githubusercontent.com/edwardtfn/HomeAssistant-Config/main/blueprints/automation/EdwardTFN/auto_update_scheduled.yaml
  input:
    when_section:
      name: Когда (расписание и т. п.)
      icon: mdi:calendar
      description: Выберите, когда должны выполняться обновления и когда их следует пропускать.
      collapsed: false
      input:
        schedule_entity:
          name: Сущность расписания
          description: 'Вы можете создать
            [расписание](https://www.home-assistant.io/integrations/schedule) в разделе [Настройки > Устройства и службы >
            Вспомогательные
            элементы](https://my.home-assistant.io/redirect/config_flow_start/?domain=schedule).
            Примечание => Окна расписания определяют, когда
            начнётся обновление. Резервное копирование, обновление или перезапуск могут завершиться после
            окончания окна расписания, но новые обновления не будут запускаться вне окон расписания.

            '
          default: []
          selector:
            entity:
              multiple: false
              domain:
              - schedule
              reorder: false
        schedule_monthday_earliest:
          name: Самый ранний день месяца для запуска процесса обновления
          description: "Обычно новая мажорная версия Home Assistant доступна в
            начале каждого месяца. Некоторые считают такие выпуски
            недостаточно стабильными и предпочитают избегать их, не
            обновляя систему до середины месяца (15-го
            числа).\nПримечания:\n  - Если выбрать день позже 28-го,
            обновления не будут запускаться каждый месяц.\n  - Выбор `0` отключает проверку.\n"
          default: 0
          selector:
            number:
              min: 1.0
              max: 31.0
              step: 1.0
              mode: slider
        schedule_monthday_last:
          name: Самый поздний день месяца для запуска процесса обновления
          description: "Укажите последний день месяца, до которого может
            выполняться это обновление.\nПримечание:\n  - Выбор
            `0` или даты меньше «Самого раннего дня» отключает проверку.\n"
          default: 0
          selector:
            number:
              min: 0.0
              max: 31.0
              step: 1.0
              mode: slider
        update_out_of_schedule:
          name: Сущности обновлений вне расписания
          description: "`Необязательно`\n\nМожно выбрать сущности обновлений, которые будут
            обновляться сразу после обнаружения обновления,\nдаже если это
            происходит вне окон расписания.\n\nПримечания:\n  - Сущности паузы
            учитываются и предотвращают обновление сущностей вне расписания.\n  -
            Обновление вне расписания может вызвать перезапуск в неожиданное
            время, вне обычного расписания.\n    Используйте эту возможность с осторожностью.\n"
          default: []
          selector:
            entity:
              multiple: true
              domain:
              - update
              reorder: false
        pause_entities:
          name: Сущности для приостановки обновлений
          description: '`Необязательно`


            Можно выбрать одну или несколько сущностей для приостановки обновлений.
            Если любая выбранная сущность находится в
            состоянии "On" или "True", система не будет обновляться во время
            расписания.


            Это можно использовать для приостановки обновлений,
            когда дома проходит вечеринка, или когда вы
            в отпуске и не хотите беспокоиться об обновлениях Home Assistant.


            '
          default: []
          selector:
            entity:
              multiple: true
              domain:
              - input_boolean
              - binary_sensor
              - switch
              reorder: false
    what_section:
      name: Что (необязательно)
      icon: mdi:update
      description: Выберите, что следует обновлять, а что обновлять не следует.
      collapsed: true
      input:
        core_os_update_mode:
          name: Режим обновления ядра и ОС Home Assistant
          description: "Выберите режим обновления ядра Home Assistant и ОС Home
            Assistant.\n* Все: будут установлены все обновления.\n* Только
            исправления:\n  ✅ С 2022.11.0 до 2022.11.3 будет выполнено
            обновление (исправление).\n  ❌ С 2022.11.x до 2022.12.x обновление
            будет пропущено (минорное обновление).\n  ❌ С 2022.12.x до 2023.1.x
            обновление будет пропущено (мажорное обновление).\n* Не обновлять: игнорировать любые обновления.\n"
          default: all
          selector:
            select:
              multiple: false
              options:
              - label: Все
                value: all
              - label: Только исправления
                value: patches
              - label: Не обновлять
                value: ignore
              sort: false
              custom_value: false
        firmware_update_mode:
          name: Режим обновления прошивки устройств
          description: "Выберите режим обновления прошивки устройств, подключённых к Home Assistant
            (если обновление поддерживается как обновление HA).\n* Все: будут установлены
            все обновления.\n* Только исправления:\n  ✅ С 2022.11.0 до 2022.11.3 будет
            выполнено обновление (исправление).\n  ❌ С 2022.11.x до 2022.12.x обновление
            будет пропущено (минорное обновление).\n  ❌ С 2022.12.x до 2023.1.x обновление
            будет пропущено (мажорное обновление).\n* Не обновлять: игнорировать любые обновления.\n"
          default: all
          selector:
            select:
              multiple: false
              options:
              - label: Все
                value: all
              - label: Только исправления
                value: patches
              - label: Не обновлять
                value: ignore
              sort: false
              custom_value: false
        general_update_mode:
          name: Режим общих обновлений
          description: "Выберите режим обновления для всего, что не является прошивкой устройства
            или компонентом ядра Home Assistant.\nСюда входят дополнения, компоненты
            HACS, пользовательские карточки и т. д.\n* Все: будут установлены все
            обновления.\n* Только исправления:\n  ✅ С 2022.11.0 до 2022.11.3 будет
            выполнено обновление (исправление).\n  ❌ С 2022.11.x до 2022.12.x обновление
            будет пропущено (минорное обновление).\n  ❌ С 2022.12.x до 2023.1.x
            обновление будет пропущено (мажорное обновление).\n* Не обновлять: игнорировать любые обновления.\n"
          default: all
          selector:
            select:
              multiple: false
              options:
              - label: Все
                value: all
              - label: Только исправления
                value: patches
              - label: Не обновлять
                value: ignore
              sort: false
              custom_value: false
        update_inclusion_mode:
          name: Режим включения сущностей
          description: "Выберите режим включения сущностей. * Все:\n  Сформировать список сущностей
            обновлений из всех доступных сущностей update.*, находящихся в состоянии
            'on'.\n* Указанные/Указанная одна:\n  Сформировать список сущностей обновлений
            из указанного списка, отфильтровав сущности в состоянии 'on'.\n  - Указанные:
            обновлять все подходящие сущности\n  - Указанная одна: обновлять только первую
            подходящую сущность\n* Фильтр поиска:\n  Работает как фильтр с подстановочными
            символами.\n  Примеры:\n    'update.zigbee2mqtt_'   => все сущности обновлений
            из дополнения zigbee2mqtt\n    'update.esphome_'       => все сущности
            обновлений устройств esphome, если их имена начинаются с 'esphome_'\n* Фильтр
            поиска — одна:\n  Как фильтр поиска, но только первая сущность. (Сортировка по алфавиту)"
          default: all
          selector:
            select:
              multiple: false
              options:
              - label: Все
                value: all
              - label: Указанные
                value: specified
              - label: Указанная одна
                value: specified-single
              - label: Фильтр поиска
                value: searchfilter
              - label: Фильтр поиска — одна
                value: searchfilter-single
              sort: false
              custom_value: false
        update_inclusion_entity_list:
          name: Список включаемых сущностей
          description: '=> Важно: этот список сущностей используется только при
            режиме включения обновлений "Указанные" или
            "Указанная одна". Выберите элементы, которые следует обновлять.'
          default: []
          selector:
            entity:
              multiple: true
              domain:
              - update
              reorder: false
        update_inclusion_entity_searchfilter:
          name: Фильтр поиска включаемых сущностей
          description: '=> Важно: этот фильтр поиска используется только при режиме
            включения обновлений "Searchfilter" или "Searchfilter-Single". Он
            определяет фильтр для поиска нужных сущностей обновлений. Это
            позволяет выполнять поиск группы сущностей с использованием
            подстановочных символов, например "все сущности zigbee" или "всё от Sonoff" и т. п.'
          default: ''
          selector:
            text:
              multiline: false
              multiple: false
        update_exclusions:
          name: Исключения
          description: '`Необязательно` 


            Выберите элементы, которые НЕ должны включаться в автоматические обновления.


            => Используйте это, если хотите оставить какое-либо дополнение
            на определённой версии и избежать его автоматического обновления.

            '
          default: []
          selector:
            entity:
              multiple: true
              domain:
              - update
              reorder: false
        minimum_patch_version:
          name: Минимальная версия исправления
          description: "Минимальный номер исправления, необходимый для автоматической
            установки обновления.\nПри значении `0` (по умолчанию) этот фильтр
            отключён, и учитываются все обновления независимо от версии
            исправления.\nПри значении больше `0` любая сущность обновления, у
            которой последняя версия имеет номер исправления ниже этого порога,
            будет пропущена. Это применяется ко всем обновлениям ядра/ОС, прошивки
            и общим обновлениям.\nПримеры:\n  - `1`: пропустить `x.y.0`, разрешить
            `x.y.1` и выше.\n  - `2`: пропустить `x.y.0` и `x.y.1`, разрешить
            `x.y.2` и выше.\n\nПримечание: для сущностей обновлений, у которых
            версию невозможно разобрать как версию с точками, эта проверка молча пропускается и обновление разрешается.\n"
          default: 0
          selector:
            number:
              min: 0.0
              max: 9.0
              step: 1.0
              mode: slider
    backup_section:
      name: Резервное копирование (необязательно)
      icon: mdi:backup-restore
      description: Выберите параметры резервного копирования
      collapsed: true
      input:
        backup_mode:
          name: Создать резервную копию перед началом обновлений?
          description: "Выберите, когда создавать резервную копию перед установкой обновлений.\nРезервные копии
            создаются с помощью действия
            [backup.create_automatic](https://www.home-assistant.io/integrations/backup/#action-backupcreate_automatic),
            которое использует настроенные вами параметры резервного копирования в разделе [Настройки >
            Система > Резервные копии](https://my.home-assistant.io/redirect/backup/).\n* **Никогда**: эта
            автоматизация не будет создавать резервную копию.\n* **Если свежая резервная копия не
            обнаружена**: резервная копия будет создана только если последняя успешная\n  резервная копия
            старше порога \"Максимальный возраст резервной копии\".\n  Для этого необходимо настроить
            параметры \"Датчик состояния резервного копирования\", \"Датчик последней успешной
            автоматической резервной копии\"\n  и \"Максимальный возраст резервной копии\", указанные ниже.\n\n* **Всегда**:
            перед установкой обновлений всегда будет создаваться резервная копия.\n"
          default: never
          selector:
            select:
              multiple: false
              options:
              - label: Никогда
                value: never
              - label: Если свежая резервная копия не обнаружена
                value: auto
              - label: Всегда
                value: always
              sort: false
              custom_value: false
        backup_timeout:
          name: Тайм-аут резервного копирования
          description: 'Максимальное время ожидания завершения процесса резервного копирования.

            Используется только когда параметр "Создать резервную копию перед началом обновлений?"
            установлен в "Если свежая резервная копия не обнаружена" или "Всегда". 

            Если ниже настроен датчик состояния резервного
            копирования, автоматизация будет отслеживать состояние и продолжит работу
            сразу после завершения. В противном случае она будет ждать весь указанный период.

            '
          default: 60
          selector:
            number:
              mode: box
              min: 1.0
              max: 180.0
              unit_of_measurement: minutes
              step: 1.0
        run_during_backup:
          name: Датчик состояния резервного копирования
          description: '`Необязательно` 
            Выберите датчик состояния менеджера резервного копирования из
            встроенной интеграции резервного копирования Home Assistant.


            После выбора этого датчика автоматизация будет
            ждать состояния `idle` системы резервного копирования перед началом обновлений.


            Обновления не будут выполняться, пока система резервного копирования находится
            в любом другом состоянии (`create_backup`, `receive_backup`, `restore_backup`,
            `blocked`) или "unavailable".  Этот датчик также используется для определения
            завершения резервной копии, созданной этой автоматизацией, вместо использования
            фиксированного тайм-аута.  **Обязательно**, когда режим резервного копирования
            установлен в "Если свежая резервная копия не обнаружена".


            Этот датчик предоставляется [интеграцией Backup](https://www.home-assistant.io/integrations/backup/)
            и обычно называется `sensor.backup_backup_manager_state`.
            Если датчик не выбран, эта автоматизация не будет приостанавливаться 
            из-за выполняющегося резервного копирования.










            '
          default: []
          selector:
            entity:
              multiple: false
              filter:
              - domain:
                - sensor
                device_class:
                - enum
                integration: backup
              reorder: false
        last_backup_timestamp_entity:
          name: Датчик последней успешной автоматической резервной копии
          description: '`Необязательно`


            Выберите датчик времени "Последняя успешная автоматическая
            резервная копия" из встроенной интеграции резервного копирования
            Home Assistant.

            **Обязательно**, когда режим резервного копирования установлен в
            "Если свежая резервная копия не обнаружена". Этот датчик предоставляется
            [интеграцией Backup](https://www.home-assistant.io/integrations/backup/)
            и обычно называется `sensor.backup_last_successful_automatic_backup`.





            '
          default: []
          selector:
            entity:
              multiple: false
              filter:
              - domain:
                - sensor
                device_class:
                - timestamp
                integration: backup
              reorder: false
        max_backup_age:
          name: Максимальный возраст резервной копии
          description: '`Необязательно` 


            Максимально допустимый возраст последней успешной автоматической резервной копии.


            **Обязательно**, когда режим резервного копирования установлен в 
            "Если свежая резервная копия не обнаружена". В этом режиме новая
            резервная копия будет создана только если последняя успешная
            резервная копия старше этого порога.

            Когда режим резервного копирования установлен в "Всегда" или 
            "Никогда", этот параметр игнорируется.



            '
          default:
            days: 1
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_day: true
              enable_second: true
    actions_section:
      name: Действия (необязательно)
      icon: mdi:shoe-print
      description: 'Выберите действия, которые будут выполняться в разные моменты
        процесса обновления.

        Действия "Перед обновлением", "Перед перезапуском" и "После обновления"
        выполняются один раз на соответствующих этапах.

        Специальные действия этапов (Начало, Резервное копирование, Ход обновления,
        Ошибки, Перезапуск, Завершено) выполняются при каждом возникновении
        соответствующего этапа и имеют доступ к полезным переменным, таким как
        список ожидающих обновлений, текущая обновляемая сущность и
        сообщение журнала с описанием текущего этапа. Они не зависят от встроенной системы уведомлений.
        '
      collapsed: true
      input:
        actions_pre_update:
          name: Действия перед обновлением
          description: "`Необязательно`\n\nДействия, выполняемые перед началом резервного копирования или
            любого обновления.\n\nМожно использовать для отправки уведомлений,
            включения/выключения устройств или активации сцен перед началом
            обновлений.\n\n\nПримечание => Обратите внимание, что все действия будут
            выполняться непосредственно перед процессом обновления,\nкоторый может происходить
            ночью. Учитывайте это при выборе действий.\n\nПримечание => Некоторые полезные
            переменные, доступные вашим действиям:\n  - `{{ updates_list }}` - содержит список
            обновлений на момент запуска автоматизации.\n  - `{{ updates_pending }}`
            - содержит список обновлений, оставшихся для обработки.\n"
          default: []
          selector:
            action: {}
        actions_pre_restart:
          name: Действия перед перезапуском
          description: "`Необязательно`\n\nДействия, выполняемые перед тем, как автоматизация запросит
            перезапуск.\n\nМожно использовать для отправки
            уведомлений,\nвключения/выключения устройств или остановки автоматизаций перед
            перезапуском Home Assistant.\n\n\nПримечание => Обратите внимание, что все
            действия будут выполняться непосредственно перед процессом
            перезапуска,\nкоторый может происходить ночью. Учитывайте это при выборе
            действий.\n\nПримечание => Обратите внимание, что не все перезапуски будут
            контролироваться этой автоматизацией,\nнапример при установке обновления ядра.
            В таких случаях эти действия могут не выполниться.\n\nПримечание => Некоторые
            полезные переменные, доступные вашим действиям:\n  - `{{ updates_list }}` -
            содержит список обновлений на момент запуска автоматизации.\n  
            - `{{ updates_pending }}` - содержит список обновлений, оставшихся для обработки.\n"
          default: []
          selector:
            action: {}
        actions_pos_update:
          name: Действия после обновления
          description: "`Необязательно`\n\nДействия, выполняемые ПОСЛЕ завершения процесса
            обновления.\n\nМожно использовать для отправки уведомлений, включения/выключения
            устройств или активации сцен после применения обновлений.\n\n\nПримечание =>
            Обратите внимание, что все действия будут выполняться сразу после процесса
            обновления,\nкоторый может происходить ночью.\nУчитывайте это при выборе
            действий.\n\nПримечание => Некоторые полезные переменные, доступные вашим
            действиям:\n  - `{{ updates_list }}` - содержит список обновлений на момент
            запуска автоматизации.\n  - `{{ updates_pending }}` - содержит список обновлений,
            оставшихся для обработки.\n\n**ВАЖНО** => Некоторые обновления автоматически
            перезапускают Home Assistant,\nиз-за чего автоматизация прерывается до завершения
            и действия после обновления не выполняются.\nЕсли после обновления необходимо
            выполнить критически важные действия,\nрассмотрите возможность включить их также
            в другую автоматизацию, запускаемую при старте Home Assistant.\n"
          default: []
          selector:
            action: {}
        notification_action_starting:
          name: Действие этапа — Начало
          description: "`Необязательно`\n\nДействия, выполняемые при начале процесса
            обновления.\n\nДоступные полезные переменные:\n  - `{{ updates_list }}` - список
            идентификаторов всех сущностей обновлений, обнаруженных при запуске
            автоматизации.\n  - `{{ updates_pending }}` - список идентификаторов сущностей
            обновлений, которые осталось обработать.\n  - `{{ updates_pending_count }}` -
            количество ожидающих обновлений.\n  - `{{ log_message }}` - обычное текстовое сообщение с описанием текущего этапа.\n"
          default: []
          selector:
            action: {}
        notification_action_backup:
          name: Действие этапа — Резервное копирование
          description: "`Необязательно`\n\nДействия, выполняемые на каждом этапе, связанном с резервным
            копированием (начало, завершение или окончание резервного ожидания).\n\nДоступные
            полезные переменные:\n  - `{{ log_message }}` - обычное текстовое сообщение с
            описанием произошедшего.\n  - `{{ updates_list }}` - список идентификаторов всех
            сущностей обновлений, обнаруженных при запуске автоматизации.\n  - `{{
            updates_pending }}` - список идентификаторов сущностей обновлений, которые осталось обработать.\n"
          default: []
          selector:
            action: {}
        notification_action_update_progress:
          name: Действие этапа — Ход обновления
          description: "`Необязательно`\n\nДействия, выполняемые для каждого отдельного обновления
            (при его начале и завершении или тайм-ауте).\n\nДоступные полезные
            переменные:\n  - `{{ current_update_entity }}` - идентификатор
            обрабатываемой сущности обновления (например,
            `update.home_assistant_core_update`).\n  - `{{
            current_update_entity_friendly_name }}` - понятное имя обрабатываемого
            обновления.\n  - `{{ log_message }}` - обычное текстовое сообщение с
            описанием текущего этапа.\n  - `{{ updates_list }}` - список идентификаторов
            всех сущностей обновлений, обнаруженных при запуске автоматизации.\n  
            - `{{ updates_pending }}` - список идентификаторов сущностей обновлений, которые осталось обработать.\n"
          default: []
          selector:
            action: {}
        notification_action_errors:
          name: Действие этапа — Ошибки и предупреждения
          description: "`Необязательно`\n\nДействия, выполняемые при возникновении ошибки или предупреждения
            (тайм-ауты обновлений, ошибки резервного копирования,\nоставшиеся незавершённые
            обновления или неправильная настройка резервного копирования).\n\nДоступные полезные
            переменные:\n  - `{{ log_message }}` - обычное текстовое сообщение с описанием
            ошибки.\n  - `{{ current_update_entity }}` - идентификатор обрабатываемой сущности
            обновления (если применимо).\n  - `{{ current_update_entity_friendly_name }}` -
            понятное имя обновления (если применимо).\n  - `{{ updates_list }}` - список
            идентификаторов всех сущностей обновлений, обнаруженных при запуске автоматизации.\n
            - `{{ updates_pending }}` - список идентификаторов сущностей обновлений, которые осталось обработать.\n"
          default: []
          selector:
            action: {}
        notification_action_restart:
          name: Действие этапа — Перезапуск
          description: "`Необязательно`\n\nДействия, выполняемые при ожидающемся перезапуске.\nОни
            выполняются перед фактическим перезапуском, чтобы действия успели
            завершиться.\n\nДоступные полезные переменные:\n  - `{{ pending_restart_items
            }}` - список имён элементов, требующих перезапуска.\n  - `{{
            pending_restart_items_count }}` - количество элементов, требующих перезапуска.\n
            - `{{ log_message }}` - обычное текстовое сообщение с описанием текущего
            этапа.\n  - `{{ updates_list }}` - список идентификаторов всех сущностей обновлений, обнаруженных при запуске автоматизации.\n"
          default: []
          selector:
            action: {}
        notification_action_done:
          name: Действие этапа — Завершено
          description: "`Необязательно`\n\nДействия, выполняемые после завершения процесса
            обновления.\n\nДоступные полезные переменные:\n  - `{{ remaining_updates
            }}` - список имён незавершённых обновлений (если есть).\n  - `{{
            remaining_updates_count }}` - количество оставшихся обновлений.\n  - `{{
            updates_list }}` - список идентификаторов всех сущностей обновлений,
            обнаруженных при запуске автоматизации.\n  - `{{ updates_pending }}` -
            список идентификаторов оставшихся сущностей обновлений (должен совпадать с
            remaining_updates).\n  - `{{ log_message }}` - обычное текстовое сообщение с описанием текущего этапа.\n"
          default: []
          selector:
            action: {}
    notification_section:
      name: Уведомления (необязательно)
      icon: mdi:bell
      description: Здесь можно настроить необязательные уведомления.
         Выберите сущность notify, чтобы включить уведомления.
      collapsed: true
      input:
        notification_entity:
          name: Сущность уведомлений
          description: 'Выберите сущность notify для отправки сообщений.
            Сущности notify предоставляются интеграциями уведомлений (например,
            Telegram, email и т. д.) и находятся в домене `notify`. Если нужного получателя
            уведомлений нет в списке, можно создать
            [группу уведомлений](https://www.home-assistant.io/integrations/group/#notify-groups)
            (даже с одним устройством), чтобы она стала доступной для выбора как сущность.

            Примечание: уведомления отправляются обычным текстом. Если ваш сервис
            уведомлений поддерживает расширенное форматирование (например, Telegram
            MarkdownV2), вместо этого можно использовать действия этапов для отправки сообщений
            с нужным форматированием. Оставьте пустым, чтобы отключить уведомления.


            '
          default: []
          selector:
            entity:
              multiple: false
              domain:
              - notify
              reorder: false
        notification_message_title:
          name: Заголовок уведомления
          description: '`Необязательно` 


            Выберите заголовок, который будет использоваться в каждом
            уведомлении.  Можно ввести собственный текст или выбрать один
            из предопределённых вариантов.


            Вариант по умолчанию "Понятное имя автоматизации" использует имя,
            заданное этой автоматизации при её создании (например,
            "Ночное автоматическое обновление").

            Если у автоматизации нет понятного имени,
            используется "Автоматическое обновление Home Assistant".



            '
          default: friendly_name
          selector:
            select:
              custom_value: true
              multiple: false
              options:
              - label: Понятное имя автоматизации
                value: friendly_name
              - label: Идентификатор сущности автоматизации
                value: entity_id
              - label: Пусто (без заголовка)
                value: blank
              sort: false
        notification_select_notifications:
          name: Что уведомлять
          description: 'Выберите этапы, которые должны вызывать уведомления.


            Примечание => Уведомление "Начало" включает список ожидающих
            обновлений. Уведомление "Завершено" включает все
            оставшиеся незавершённые обновления.

            '
          default:
          - starting
          - errors
          - done
          selector:
            select:
              multiple: true
              options:
              - label: Начало (включает список обновлений)
                value: starting
              - label: Ход резервного копирования
                value: backup
              - label: Ход обновления (для каждой сущности)
                value: update_progress
              - label: Только ошибки и предупреждения
                value: errors
              - label: Перезапуск
                value: restart
              - label: Завершено (включает оставшиеся обновления)
                value: done
              sort: false
              custom_value: false
    general_settings:
      name: Общие настройки (необязательно)
      icon: mdi:cog
      description: Выберите дополнительные настройки процесса обновления
      collapsed: true
      input:
        restart_type:
          name: Принудительно перезапустить Home Assistant, если этого требует какое-либо обновление?
          description: 'Это не повлияет на обновления, при которых перезапуск выполняется автоматически,
            но для обновлений, требующих ручного перезапуска (что довольно часто встречается в HACS),
            этот блюпринт может принудительно выполнить перезапуск после завершения обновлений.

            '
          default: no-restart
          selector:
            select:
              multiple: false
              options:
              - label: Не выполнять принудительный перезапуск
                value: no-restart
              - label: Перезапустить ядро Home Assistant
                value: core
              - label: Перезапустить хост Home Assistant
                value: host
              sort: false
              custom_value: false
        verbose_logging_bool:
          name: Подробно записывать ход работы дополнений в журнал?
          description: '`Необязательно`


            При включении эта автоматизация будет записывать каждый
            этап в журнал.  Это может быть полезно для поиска
            неисправностей, но в обычных условиях не даёт большой пользы.



            '
          default: false
          selector:
            boolean: {}
        update_process_started_entity:
          name: 'Переключатель "Процесс обновления запущен"'
          description: '`Необязательно`


            Можно создать [вспомогательный переключатель](https://www.home-assistant.io/integrations/input_boolean)
            в разделе [Настройки > Устройства и службы > Вспомогательные элементы](https://my.home-assistant.io/redirect/config_flow_start/?domain=input_boolean).


            Эта сущность используется для определения того, нужно ли ещё выполнять резервное
            копирование при запуске автоматизации — она нужна для внутренней работы этой
            автоматизации.  Это предотвращает создание нескольких резервных копий в
            одном окне обновления.





            '
          default: []
          selector:
            entity:
              multiple: false
              domain:
              - input_boolean
              reorder: false
        update_timeout:
          name: Тайм-аут обновления
          description: 'Максимальное время ожидания завершения каждого обновления. 


            Это защищает автоматизацию от бесконечного ожидания неудачного обновления.

            Обычно обновления не занимают так много времени,
            поэтому при необходимости настройте это время под вашу среду.

            По умолчанию установлено 1200 секунд (20 минут).

            Можно выбрать любое значение от 10 секунд до 7200 секунд (2 часа).


            Если время ожидания обновления истекло:

            - Автоматизация запишет сообщение об ошибке

            - Автоматизация продолжит работу со следующим обновлением

            - Обновление, для которого истёк тайм-аут, всё ещё может завершиться в фоновом режиме




           '
          default: 1200
          selector:
            number:
              min: 10.0
              max: 7200.0
              step: 10.0
              unit_of_measurement: seconds
              mode: box
mode: single
max_exceeded: warning
trigger_variables:
  input_pause_entities: !input pause_entities
  input_update_exclusions: !input update_exclusions
  schedule_monthday_earliest: !input schedule_monthday_earliest
  schedule_monthday_last: !input schedule_monthday_last
  input_schedule_monthday_earliest: '{{ schedule_monthday_earliest | int(0) }}'
  input_schedule_monthday_last: '{{ schedule_monthday_last | int(0) }}'
  input_update_inclusion_entity_list: !input update_inclusion_entity_list
  input_update_inclusion_entity_searchfilter: !input update_inclusion_entity_searchfilter
  input_update_process_started_entity: !input update_process_started_entity
  update_out_of_schedule: !input update_out_of_schedule
trigger:
- id: HA Schedule based
  platform: state
  entity_id: !input schedule_entity
- id: HA Start
  platform: homeassistant
  event: start
- id: New update
  platform: template
  value_template: "{% set ns = namespace(found=false) %} {% for e in states.update
    | default([])\n     | selectattr(\"state\", \"eq\", \"on\")\n     | rejectattr(\"entity_id\",
    \"in\", input_update_exclusions)\n     | rejectattr(\"entity_id\", \"in\", update_out_of_schedule)
    %}\n  {% if (e.attributes.supported_features | int(0)) | bitwise_and(1) %}\n    {%
    set ns.found = true %}\n  {% endif %}\n{% endfor %} {{ ns.found }}"
- id: New day
  platform: template
  value_template: "{{\n  (now().day >= input_schedule_monthday_earliest or input_schedule_monthday_earliest
    == 0) and\n  (\n    now().day <= input_schedule_monthday_last or\n    input_schedule_monthday_last
    == 0 or\n    input_schedule_monthday_last < input_schedule_monthday_earliest\n
    \ )\n}}\n"
- id: Automations reloaded
  platform: event
  event_type: automation_reloaded
- id: Pause entities changed
  platform: state
  entity_id: !input pause_entities
- id: Out of schedule
  platform: state
  entity_id: !input update_out_of_schedule
  from: 'off'
  to: 'on'
- id: Backup sensor recovered
  platform: state
  entity_id: !input run_during_backup
  to: idle
condition:
- condition: or
  conditions:
  - condition: trigger
    id: Backup sensor recovered
  - condition: trigger
    id: Out of schedule
  - condition: and
    conditions:
    - condition: or
      conditions:
      - condition: trigger
        id: HA Start
      - condition: trigger
        id: Automations reloaded
    - condition: template
      value_template: "{{\n  states.update\n  | default([])\n  | selectattr(\"state\",
        \"eq\", \"on\")\n  | selectattr(\"entity_id\", \"in\", installable_entities)\n
        \ | selectattr(\"entity_id\", \"in\", update_out_of_schedule)\n  | rejectattr(\"entity_id\",
        \"in\", input_update_exclusions)\n  | list | count | int(0) > 0\n}}"
  - condition: and
    conditions:
    - condition: state
      entity_id: !input schedule_entity
      state: 'on'
    - condition: template
      value_template: "{{\n  states.update\n  | default([])\n  | selectattr(\"state\",
        \"eq\", \"on\")\n  | selectattr(\"entity_id\", \"in\", installable_entities)\n
        \ | rejectattr(\"entity_id\", \"in\", input_update_exclusions)\n  | list |
        count | int(0) > 0\n}}"
  - condition: and
    conditions:
    - condition: trigger
      id: HA Start
    - '{{ input_update_process_started_entity | default([]) | count == 1 }}'
    - condition: state
      entity_id: !input update_process_started_entity
      state: 'on'
- condition: or
  conditions:
  - condition: trigger
    id: Out of schedule
  - condition: template
    value_template: "{{\n  (now().day >= input_schedule_monthday_earliest or input_schedule_monthday_earliest
      == 0) and\n  (now().day <= input_schedule_monthday_last or input_schedule_monthday_last
      == 0)\n}}\n"
- condition: or
  conditions:
  - '{{ input_pause_entities | default([]) | list | count | int(0) < 1 }}'
  - condition: state
    entity_id: !input pause_entities
    state: 'off'
variables:
  installable_entities: "{% set ns = namespace(list=[]) %} {% for e in states.update
    | default([]) %}\n  {% if (e.attributes.supported_features | int(0)) | bitwise_and(1)
    %}\n    {% set ns.list = ns.list + [e.entity_id] %}\n  {% endif %}\n{% endfor
    %} {{ ns.list }}\n"
  temp_input_update_exclusions: !input update_exclusions
  input_verbose_logging_bool: !input verbose_logging_bool
  input_core_os_update_mode: !input core_os_update_mode
  input_firmware_update_mode: !input firmware_update_mode
  input_general_update_mode: !input general_update_mode
  input_update_inclusion_mode: !input update_inclusion_mode
  input_minimum_patch_version: !input minimum_patch_version
  input_notification_entity: !input notification_entity
  input_notification_select_notifications: !input notification_select_notifications
  input_notification_message_title: !input notification_message_title
  core_update_entity: "{% for u in integration_entities('hassio') | select('search',
    '^update[.]')\n  if (device_attr(u, 'identifiers') | first | default(\"\"))[1]
    == 'core' %}\n    {{ u }}\n{% endfor %}\n"
  os_update_entity: "{% for u in integration_entities('hassio') | select('search',
    '^update[.]')\n  if (device_attr(u, 'identifiers') | first | default(\"\"))[1]
    == 'OS' %}\n    {{ u }}\n{% endfor %}\n"
  supervisor_update_entity: "{% for u in integration_entities('hassio') | select('search',
    '^update[.]')\n  if (device_attr(u, 'identifiers') | first | default(\"\"))[1]
    == 'supervisor' %}\n    {{ u }}\n{% endfor %}\n"
  is_resume_after_restart: "{{\n  input_update_process_started_entity | default([])
    | count == 1 and\n  is_state(input_update_process_started_entity | first | default(\"\"),
    \"on\")\n}}\n"
  is_out_of_schedule_mode: "{{\n  trigger.id == \"Out of schedule\" or\n  (\n    (trigger.id
    == \"HA Start\" or trigger.id == \"Automations reloaded\") and\n    (\n      states.update\n
    \     | default([])\n      | selectattr(\"state\", \"eq\", \"on\")\n      | selectattr(\"entity_id\",
    \"in\", installable_entities)\n      | selectattr(\"entity_id\", \"in\", update_out_of_schedule)\n
    \     | rejectattr(\"entity_id\", \"in\", input_update_exclusions)\n      | list
    | count | int(0) > 0\n    )\n  )\n}}\n"
  friendly_name: "{% set friendly_name_tmp = state_attr(this.entity_id, \"friendly_name\")
    | default(\"\") %}\n{{\n  friendly_name_tmp\n  if friendly_name_tmp is string
    and friendly_name_tmp | length > 0\n  else \"Home Assistant Auto-update\"\n}}\n"
  notification_title: "{% if (input_notification_message_title == \"friendly_name\")
    %}\n  {{ friendly_name }}\n{% elif (input_notification_message_title == \"entity_id\")
    %}\n  {{ this.entity_id }}\n{% elif (input_notification_message_title != \"blank\"
    and\n          input_notification_message_title is string and\n          input_notification_message_title
    | length > 0) %}\n  {{ input_notification_message_title }}\n{% else %}\n  {{ \"\"
    }}\n{% endif %}\n"
  non_installable_entities: "{% set ns = namespace(list=[]) %} {% for entity in states.update
    | default([]) %}\n  {% if not (entity.attributes.supported_features | int(0))
    | bitwise_and(1) %}\n    {% set ns.list = ns.list + [entity.entity_id] %}\n  {%
    endif %}\n{% endfor %} {{ ns.list }}\n"
action:
- alias: Обновить сущности обновлений
  action: homeassistant.update_entity
  data:
    entity_id: "{{\n  states.update\n  | default([])\n  | rejectattr('entity_id',
      'in', input_update_exclusions)\n  | map(attribute='entity_id')\n  | list\n}}\n"
  continue_on_error: true
- &id002
  variables:
    firmware_update_entities: "{% if is_out_of_schedule_mode %}\n  {# For out-of-schedule
      triggers, return empty list #}\n  {# The update_out_of_schedule list will be
      added to combined_list directly #}\n  []\n{% else %}\n  {{\n    states.update\n
      \   | default([])\n    | selectattr(\"state\", \"eq\", \"on\")\n    | selectattr('attributes.device_class',
      'defined')\n    | selectattr('attributes.device_class', 'eq', 'firmware')\n
      \   | rejectattr('entity_id', 'in', input_update_exclusions)\n    | map(attribute='entity_id')\n
      \   | list\n  }}\n{% endif %}\n"
    general_update_entities: "{% if is_out_of_schedule_mode %}\n  {# For out-of-schedule
      triggers, return empty list #}\n  {# The update_out_of_schedule list will be
      added to combined_list directly #}\n  []\n{% elif input_update_inclusion_mode
      == \"all\" %}\n  {{\n    states.update\n    | default([])\n    | selectattr('state',
      'eq', 'on')\n    | rejectattr('entity_id', 'in', core_update_entity)\n    |
      rejectattr('entity_id', 'in', os_update_entity)\n    | rejectattr('entity_id',
      'in', supervisor_update_entity)\n    | rejectattr('entity_id', 'in', firmware_update_entities)\n
      \   | rejectattr('entity_id', 'in', input_update_exclusions)\n    | map(attribute='entity_id')\n
      \   | list\n  }}\n{% elif input_update_inclusion_mode == \"specified\" %}\n
      \ {{\n    states.update\n    | default([])\n    | selectattr('state', 'eq',
      'on')\n    | selectattr('entity_id', 'in', input_update_inclusion_entity_list)\n
      \   | rejectattr('entity_id', 'in', core_update_entity)\n    | rejectattr('entity_id',
      'in', os_update_entity)\n    | rejectattr('entity_id', 'in', supervisor_update_entity)\n
      \   | rejectattr('entity_id', 'in', firmware_update_entities)\n    | rejectattr('entity_id',
      'in', input_update_exclusions)\n    | map(attribute='entity_id')\n    | list\n
      \ }}\n{% elif input_update_inclusion_mode == \"specified-single\" %}\n  {{\n
      \   states.update\n    | default([])\n    | selectattr('state', 'eq', 'on')\n
      \   | selectattr('entity_id', 'in', input_update_inclusion_entity_list)\n    |
      rejectattr('entity_id', 'in', core_update_entity)\n    | rejectattr('entity_id',
      'in', os_update_entity)\n    | rejectattr('entity_id', 'in', supervisor_update_entity)\n
      \   | rejectattr('entity_id', 'in', firmware_update_entities)\n    | rejectattr('entity_id',
      'in', input_update_exclusions)\n    | map(attribute='entity_id')\n    | list\n
      \   | first\n    | default(\"\")\n  }}\n{% elif input_update_inclusion_mode
      == \"searchfilter\" %}\n  {{\n    states.update\n    | default([])\n    | selectattr('state',
      'eq', 'on')\n    | selectattr('entity_id', 'match', input_update_inclusion_entity_searchfilter)\n
      \   | rejectattr('entity_id', 'in', core_update_entity)\n    | rejectattr('entity_id',
      'in', os_update_entity)\n    | rejectattr('entity_id', 'in', supervisor_update_entity)\n
      \   | rejectattr('entity_id', 'in', firmware_update_entities)\n    | rejectattr('entity_id',
      'in', input_update_exclusions)\n    | map(attribute='entity_id')\n    | list\n
      \ }}\n{% elif input_update_inclusion_mode == \"searchfilter-single\" %}\n  {{\n
      \   states.update\n    | default([])\n    | selectattr('state', 'eq', 'on')\n
      \   | selectattr('entity_id', 'match', input_update_inclusion_entity_searchfilter)\n
      \   | rejectattr('entity_id', 'in', core_update_entity)\n    | rejectattr('entity_id',
      'in', os_update_entity)\n    | rejectattr('entity_id', 'in', supervisor_update_entity)\n
      \   | rejectattr('entity_id', 'in', firmware_update_entities)\n    | rejectattr('entity_id',
      'in', input_update_exclusions)\n    | map(attribute='entity_id')\n    | list\n
      \   | first\n    | default(\"\")\n  }}\n{% endif %}\n"
    input_update_exclusions: "{% set exclusions = (temp_input_update_exclusions |
      default([])) + non_installable_entities %}\n{% if input_core_os_update_mode
      == 'ignore' %}\n  {% set exclusions = exclusions + [core_update_entity | default(\"\"),
      os_update_entity | default(\"\")] %}\n{% else %}\n  {% set core_installed_version
      = states.update\n                                  | default([])\n                                  |
      selectattr('entity_id', 'in', core_update_entity | default(\"\"))\n                                  |
      map(attribute='attributes.installed_version')\n                                  |
      list\n                                  | first\n                                  |
      default('') %}\n  {% set core_latest_version = states.update\n                                |
      default([])\n                                | selectattr('entity_id', 'in',
      core_update_entity | default(\"\"))\n                                | map(attribute='attributes.latest_version')\n
      \                               | list\n                                | first\n
      \                               | default('') %}\n  {% set core_version_change
      = version(core_latest_version) - version(core_installed_version) %}\n  {% set
      os_installed_version = states.update\n                                | default([])\n
      \                               | selectattr('entity_id', 'in', os_update_entity
      | default(\"\"))\n                                | map(attribute='attributes.installed_version')\n
      \                               | list\n                                | first\n
      \                               | default('') %}\n  {% set os_latest_version
      = states.update\n                              | default([])\n                              |
      selectattr('entity_id', 'in', os_update_entity | default(\"\"))\n                              |
      map(attribute='attributes.latest_version')\n                              |
      list\n                              | first\n                              |
      default('') %}\n  {% set os_version_change = version(os_latest_version) - version(os_installed_version)
      %}\n\n  {% if input_core_os_update_mode == 'patches' %}\n    {% if core_version_change.major
      or\n          core_version_change.minor or\n          (not core_version_change.patch)
      %}\n      {% set exclusions = exclusions + [core_update_entity | default(\"\")]
      %}\n    {% endif %}\n    {% if os_version_change.major or\n          os_version_change.minor
      or\n          (not os_version_change.patch) %}\n      {% set exclusions = exclusions
      + [os_update_entity | default(\"\")] %}\n    {% endif %}\n  {% elif input_core_os_update_mode
      == 'major_and_minor' %}\n    {% if (not core_version_change.major) and (not
      core_version_change.minor) %}\n      {% set exclusions = exclusions + [core_update_entity
      | default(\"\")] %}\n    {% endif %}\n    {% if (not os_version_change.major)
      and (not os_version_change.minor) %}\n      {% set exclusions = exclusions +
      [os_update_entity | default(\"\")] %}\n    {% endif %}\n  {% endif %}\n\n  {%
      if input_minimum_patch_version | int(0) > 0 %}\n    {% set core_patch = version(core_latest_version).patch
      | int(-1) if core_latest_version else -1 %}\n    {% if core_patch >= 0 and core_patch
      < input_minimum_patch_version | int(0) %}\n      {% set exclusions = exclusions
      + [core_update_entity | default(\"\")] %}\n    {% endif %}\n    {% set os_patch
      = version(os_latest_version).patch | int(-1) if os_latest_version else -1 %}\n
      \   {% if os_patch >= 0 and os_patch < input_minimum_patch_version | int(0)
      %}\n      {% set exclusions = exclusions + [os_update_entity | default(\"\")]
      %}\n    {% endif %}\n  {% endif %}\n{% endif %}\n{% if input_firmware_update_mode
      == 'ignore' %}\n  {% set exclusions = exclusions + [ firmware_update_entities
      ] %}\n{% else %}\n  {% set ns = namespace(entities = []) %}\n  {% for entity
      in expand(firmware_update_entities)\n                    | rejectattr('entity_id',
      'in', exclusions)\n                    | selectattr('state', 'eq', 'on') %}\n
      \   {% set entity_version_change = version(entity.attributes.latest_version
      | default(''))\n                                    - version(entity.attributes.installed_version
      | default('')) %}\n    {% if input_firmware_update_mode == 'patches' %}\n      {%
      if entity_version_change.major or\n            entity_version_change.minor or\n
      \           (not entity_version_change.patch) %}\n        {% set ns.entities
      = ns.entities + [ entity.entity_id ] %}\n      {% endif %}\n    {% elif input_firmware_update_mode
      == 'major_and_minor' %}\n      {% if (not entity_version_change.major) and (not
      entity_version_change.minor) %}\n        {% set ns.entities = ns.entities +
      [ entity.entity_id ] %}\n      {% endif %}\n    {% endif %}\n    {% if input_minimum_patch_version
      | int(0) > 0 and\n          entity.entity_id not in ns.entities %}\n      {%
      set patch = version(entity.attributes.latest_version | default('')).patch |
      int(-1) %}\n      {% if patch >= 0 and patch < input_minimum_patch_version |
      int(0) %}\n        {% set ns.entities = ns.entities + [ entity.entity_id ] %}\n
      \     {% endif %}\n    {% endif %}\n  {% endfor %}\n  {% set exclusions = exclusions
      + [ ns.entities ] %}\n{% endif %}\n{% if input_general_update_mode == 'ignore'
      %}\n  {% set exclusions = exclusions + [ general_update_entities ] %}\n{% else
      %}\n  {% set ns = namespace(entities = []) %}\n  {% for entity in expand(general_update_entities)\n
      \                   | rejectattr('entity_id', 'in', exclusions)\n                    |
      selectattr('state', 'eq', 'on') %}\n    {% set entity_version_change = version(entity.attributes.latest_version
      | default(''))\n                                  - version(entity.attributes.installed_version
      | default('')) %}\n    {% if input_general_update_mode == 'patches' %}\n      {%
      if entity_version_change.major or\n            entity_version_change.minor or\n
      \           (not entity_version_change.patch) %}\n        {% set ns.entities
      = ns.entities + [ entity.entity_id ] %}\n      {% endif %}\n    {% elif input_general_update_mode
      == 'major_and_minor' %}\n      {% if (not entity_version_change.major) and (not
      entity_version_change.minor) %}\n        {% set ns.entities = ns.entities +
      [ entity.entity_id ] %}\n      {% endif %}\n    {% endif %}\n    {% if input_minimum_patch_version
      | int(0) > 0 and\n          entity.entity_id not in ns.entities %}\n      {%
      set patch = version(entity.attributes.latest_version | default('')).patch |
      int(-1) %}\n      {% if patch >= 0 and patch < input_minimum_patch_version |
      int(0) %}\n        {% set ns.entities = ns.entities + [ entity.entity_id ] %}\n
      \     {% endif %}\n    {% endif %}\n  {% endfor %}\n  {% set exclusions = exclusions
      + [ ns.entities ] %}\n{% endif %}\n{{ exclusions }}\n"
    combined_list: "{% set entities = namespace(list=[]) %} {%- if is_out_of_schedule_mode
      %}\n  {# In out-of-schedule mode: ONLY include entities from update_out_of_schedule
      list #}\n  {%- for entity in [update_out_of_schedule] %}\n    {%- if entity
      is sequence and entity is not string %}\n      {%- for item in entity %}\n        {%-
      if item is string %}\n          {%- set entities.list = entities.list + [item]
      %}\n        {%- endif %}\n      {%- endfor %}\n    {%- elif entity is string
      %}\n      {%- set entities.list = entities.list + [entity] %}\n    {%- endif
      %}\n  {%- endfor %}\n{%- else %}\n  {# Normal mode: Include all entity types
      #}\n  {%- for entity in [firmware_update_entities, general_update_entities,\n
      \                   core_update_entity, os_update_entity, supervisor_update_entity]
      %}\n    {%- if entity is sequence and entity is not string %}\n      {%- for
      item in entity %}\n        {%- if item is string %}\n          {%- set entities.list
      = entities.list + [item] %}\n        {%- endif %}\n      {%- endfor %}\n    {%-
      elif entity is string %}\n      {%- set entities.list = entities.list + [entity]
      %}\n    {%- endif %}\n  {%- endfor %}\n{%- endif %} {{ entities.list }}"
    updates_pending: "{% set updates = namespace(list=[]) %} {%- for entity in states.update
      %}\n  {%- if (entity.state == \"on\" and\n          entity.entity_id in combined_list
      and\n          entity.entity_id not in input_update_exclusions and\n          (entity.attributes.supported_features
      | int(0)) | bitwise_and(1)) %}\n    {%- set updates.list = updates.list + [entity.entity_id]
      %}\n  {%- endif %}\n{%- endfor %} {{ updates.list }}"
    pending_update_list: '{{ updates_pending }}'
    updates_pending_count: '{{ updates_pending | list | count | int(0) }}'
- variables:
    update_list: '{{ updates_pending }}'
    updates_list: '{{ updates_pending }}'
    is_there_anything_to_update: '{{ updates_pending_count > 0 }}'
- alias: Подготовка
  sequence:
  - variables:
      log_message: '{{ friendly_name }} {{ "повторно" if
        is_resume_after_restart else ""}}запускается'
  - &id001
    if: '{{ input_verbose_logging_bool }}'
    then:
    - alias: Журнал — Обновление
      action: logbook.log
      data:
        name: Автоматическое обновление
        entity_id: '{{ this.entity_id }}'
        message: '{{ log_message }}'
      continue_on_error: true
    continue_on_error: true
- alias: Сформировать список обновлений
  if:
  - '{{ is_there_anything_to_update }}'
  - condition: or
    conditions:
    - condition: template
      value_template: '{{ is_out_of_schedule_mode }}'
    - condition: state
      entity_id: !input schedule_entity
      state: 'on'
  then:
  - variables:
      log_message: "{{ friendly_name }} {{ \"повторно\" if is_resume_after_restart else
        \"\" }}запускается\nСписок обновлений:\n- {{ states.update\n    |
        selectattr('state', 'eq', 'on')\n    | selectattr('entity_id',
        'in', updates_pending)\n    | rejectattr('entity_id', 'in',
        input_update_exclusions)\n    | map(attribute='name') | list | join(\"\\n- \") }}"
  - *id001
  - if: '{{ "starting" in input_notification_select_notifications }}'
    then:
    - &id003
      sequence:
      - variables:
          notification_message: '{{ log_message }}'
      - if:
        - condition: template
          value_template: '{{ input_notification_entity | length > 0 }}'
          alias: Проверить, настроена ли сущность уведомлений
        then:
        - alias: Уведомление — Отправить сообщение
          action: notify.send_message
          target:
            entity_id: '{{ input_notification_entity }}'
          data:
            title: '{{ notification_title }}'
            message: '{{ notification_message }}'
          continue_on_error: true
  - alias: Выполнить пользовательские действия начала
    continue_on_error: true
    sequence: !input notification_action_starting
  else:
  - variables:
      log_message: '{{ friendly_name }} запущена, но обновлять нечего'
  - *id001
- alias: Установить флаг вспомогательной сущности в ON
  if:
  - '{{ input_update_process_started_entity | default([]) | count > 0 }}'
  - '{{ input_update_process_started_entity[0] | string | length > 0 }}'
  - condition: state
    entity_id: !input schedule_entity
    state: 'on'
  then:
  - action: input_boolean.turn_on
    target:
      entity_id: !input update_process_started_entity
    continue_on_error: true
- alias: Действия перед обновлением
  if:
  - '{{ is_there_anything_to_update }}'
  - condition: or
    conditions:
    - condition: template
      value_template: '{{ is_out_of_schedule_mode }}'
    - condition: state
      entity_id: !input schedule_entity
      state: 'on'
  - '{{ not is_resume_after_restart }}'
  then:
  - variables:
      input_actions_pre_update: !input actions_pre_update
  - condition: '{{ input_actions_pre_update is sequence }}'
  - *id002
  - variables:
      log_message: Выполнение действий перед обновлением...
  - *id001
  - alias: Выполнить действия перед обновлением
    continue_on_error: true
    sequence: !input actions_pre_update
  - variables:
      log_message: Действия перед обновлением завершены
  - *id001
- alias: Ожидать состояния idle системы резервного копирования
  if:
  - '{{ is_there_anything_to_update }}'
  - condition: or
    conditions:
    - condition: template
      value_template: '{{ is_out_of_schedule_mode }}'
    - condition: state
      entity_id: !input schedule_entity
      state: 'on'
  then:
  - variables:
      input_run_during_backup: !input run_during_backup
      input_backup_timeout_minutes: !input backup_timeout
      input_backup_timeout: '{{ input_backup_timeout_minutes | int(60) }}'
  - if:
    - '{{ input_run_during_backup is string and input_run_during_backup | length >
      0 }}'
    - '{{ not is_state(input_run_during_backup, "idle") }}'
    then:
    - if: "{{\n  is_state(input_run_during_backup, \"unknown\") or\n  is_state(input_run_during_backup,
        \"unavailable\")\n}}"
      then:
      - variables:
          log_message: 'Датчик состояния резервного
            копирования: {{states(input_run_during_backup) }}.
            Невозможно определить, выполняется ли резервное копирование. Остановка
           .'
      - *id001
      - if: "{{\n  \"backup\" in input_notification_select_notifications or\n  \"errors\"
          in input_notification_select_notifications\n}}"
        then:
        - *id003
      - &id004
        alias: Сбросить флаг вспомогательной сущности перед остановкой
        if:
        - '{{ input_update_process_started_entity | default([]) | count > 0 }}'
        - '{{ input_update_process_started_entity[0] | string | length > 0 }}'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: !input update_process_started_entity
          continue_on_error: true
      - stop: Датчик состояния резервного копирования недоступен
    - variables:
        log_message: 'Система резервного копирования
          занята ({{states(input_run_during_backup)}}).
          Ожидание перехода в idle до {{ input_backup_timeout }} минут...
          '
    - *id001
    - if: '{{ "backup" in input_notification_select_notifications }}'
      then:
      - *id003
    - alias: Ожидать перехода системы резервного копирования в idle
      wait_for_trigger:
      - trigger: state
        entity_id: !input run_during_backup
        to: idle
      continue_on_timeout: true
      timeout:
        minutes: '{{ input_backup_timeout | int(60) }}'
    - if: '{{ not is_state(input_run_during_backup, "idle") }}'
      then:
      - variables:
          log_message: Система резервного копирования не перешла в idle вовремя. Остановка.
      - *id001
      - if: "{{\n  \"backup\" in input_notification_select_notifications or\n  \"errors\"
          in input_notification_select_notifications\n}}"
        then:
        - *id003
      - *id004
      - stop: Система резервного копирования не перешла в idle вовремя
- alias: Резервное копирование
  if:
  - '{{ is_there_anything_to_update }}'
  - condition: or
    conditions:
    - condition: template
      value_template: '{{ is_out_of_schedule_mode }}'
    - condition: state
      entity_id: !input schedule_entity
      state: 'on'
  - '{{ not is_resume_after_restart }}'
  then:
  - *id002
  - variables:
      input_backup_mode: !input backup_mode
      input_backup_timeout_minutes: !input backup_timeout
      input_backup_timeout: '{{ input_backup_timeout_minutes | int(60) }}'
      input_run_during_backup: !input run_during_backup
      input_last_backup_timestamp_entity: !input last_backup_timestamp_entity
      temp_max_backup_age: !input max_backup_age
      input_max_backup_age_seconds: "{{\n  timedelta(\n    days=temp_max_backup_age.days,\n
        \   hours=temp_max_backup_age.hours,\n    minutes=temp_max_backup_age.minutes,\n
        \   seconds=temp_max_backup_age.seconds\n  ).total_seconds()\n}}\n"
  - alias: Раздел резервного копирования
    if:
    - '{{ input_backup_mode != "never" }}'
    then:
    - alias: Проверить требования автоматического режима
      if:
      - '{{ input_backup_mode == "auto" }}'
      - "{{\n  (input_run_during_backup is not string or input_run_during_backup |
        length == 0) or\n  (input_last_backup_timestamp_entity is not string or input_last_backup_timestamp_entity
        | length == 0)\n}}"
      then:
      - variables:
          log_message: 'ОШИБКА: автоматический режим резервного
            копирования требует настройки датчика состояния резервного копирования и датчика
            последней успешной автоматической резервной копии. Остановка
           .'
      - *id001
      - if: '{{ "errors" in input_notification_select_notifications }}'
        then:
        - *id003
      - alias: Выполнить пользовательские действия ошибки (неправильная настройка резервного копирования)
        continue_on_error: true
        sequence: !input notification_action_errors
      - *id004
      - stop: Автоматический режим резервного копирования настроен неправильно
    - alias: Определить, требуется ли резервная копия
      variables:
        needs_backup: "{% if input_backup_mode == \"always\" %}\n  {{ true }}\n{%
          elif input_backup_mode == \"auto\" %}\n  {% set last_backup_state = states(input_last_backup_timestamp_entity)
          %}\n  {% if last_backup_state in [\"unknown\", \"unavailable\", \"\"] or\n
          \       last_backup_state is none %}\n    {{ true }}\n  {% elif input_max_backup_age_seconds
          > 0 and\n          (as_timestamp(now()) - as_timestamp(last_backup_state))
          > input_max_backup_age_seconds %}\n    {{ true }}\n  {% else %}\n    {{
          false }}\n  {% endif %}\n{% else %}\n  {{ false }}\n{% endif %}\n"
    - alias: Записать результат проверки возраста резервной копии (автоматический режим)
      if:
      - '{{ input_backup_mode == "auto" }}'
      then:
      - if: '{{ needs_backup }}'
        then:
        - variables:
            log_message: "{% set last_backup_state = states(input_last_backup_timestamp_entity) %} {%
              if last_backup_state in [\"unknown\", \"unavailable\", \"\"] or\n     
              last_backup_state is none %}\n  Датчик времени резервной копии имеет
              состояние {{ last_backup_state }}. Для безопасности создаётся резервная
              копия.\n{% else %}\n  Последняя резервная копия слишком старая\n  ({{
              relative_time(as_datetime(last_backup_state)) }} назад).\n  Создание новой резервной копии...\n{% endif %}\n"
        - *id001
        else:
        - variables:
            log_message: Обнаружена свежая резервная копия. Создание резервной копии пропускается.
        - *id001
    - alias: Создать резервную копию
      continue_on_error: true
      if:
      - '{{ needs_backup }}'
      - "{{\n  input_update_process_started_entity | default([]) | count < 1 or\n
        \ is_state(input_update_process_started_entity | first | default(\"\"), \"off\")\n}}"
      then:
      - if: '{{ input_update_process_started_entity | default([]) | count > 0 }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: '{{ input_update_process_started_entity }}'
          continue_on_error: true
      - variables:
          log_message: Создание резервной копии Home Assistant
      - *id001
      - if: '{{ "backup" in input_notification_select_notifications }}'
        then:
        - *id003
      - alias: Выполнить пользовательские действия резервного копирования (начало)
        continue_on_error: true
        sequence: !input notification_action_backup
      - alias: Вызвать службу резервного копирования
        action: backup.create_automatic
        continue_on_error: true
      - alias: Ожидать завершения резервного копирования
        if:
        - '{{ input_run_during_backup is string and input_run_during_backup | length
          > 0 }}'
        then:
        - variables:
            log_message: Резервное копирование запущено. Ожидание его начала...
        - *id001
        - alias: Ожидать выхода состояния резервного копирования из idle (подтверждение запуска)
          wait_for_trigger:
          - trigger: state
            entity_id: !input run_during_backup
            from: idle
          continue_on_timeout: true
          timeout:
            seconds: 30
        - if: '{{ is_state(input_run_during_backup, "idle") }}'
          then:
          - variables:
              log_message: 'ОШИБКА: датчик состояния резервного
                копирования не изменился в течение 30
                секунд. Резервное копирование могло
не запуститься. Остановка, чтобы не
                выполнять обновления без резервной копии.'
          - *id001
          - if: "{{\n  \"backup\" in input_notification_select_notifications or\n
              \ \"errors\" in input_notification_select_notifications\n}}"
            then:
            - *id003
          - alias: Выполнить пользовательские действия ошибки (резервное копирование могло не запуститься)
            continue_on_error: true
            sequence: !input notification_action_errors
          - *id004
          - stop: Резервное копирование не запустилось
          else:
          - if: "{{\n  is_state(input_run_during_backup, \"unknown\") or\n  is_state(input_run_during_backup,
              \"unavailable\")\n}}"
            then:
            - variables:
                log_message: 'ОШИБКА: датчик состояния резервного
                  копирования изменился на {{states(input_run_during_backup) }}
                  вместо состояния резервного копирования. Остановка.
                  '
            - *id001
            - if: "{{\n  \"backup\" in input_notification_select_notifications or\n
                \ \"errors\" in input_notification_select_notifications\n}}"
              then:
              - *id003
            - alias: Выполнить пользовательские действия ошибки (неисправность датчика резервного копирования)
              continue_on_error: true
              sequence: !input notification_action_errors
            - *id004
            - stop: Датчик состояния резервного копирования стал недоступен
          - variables:
              log_message: 'Резервное копирование началось
                ({{states(input_run_during_backup)}}).
                Ожидание возврата системы резервного копирования в idle...
                '
          - *id001
          - alias: Ожидать перехода системы резервного копирования в idle после резервного копирования
            wait_for_trigger:
            - trigger: state
              entity_id: !input run_during_backup
              to: idle
            continue_on_timeout: true
            timeout:
              minutes: '{{ input_backup_timeout | int(60) }}'
          - if: '{{ not is_state(input_run_during_backup, "idle") }}'
            then:
            - variables:
                log_message: 'ПРЕДУПРЕЖДЕНИЕ: резервное
                  копирование не завершилось в течение 
                  {{input_backup_timeout }} минут. Продолжение обновлений...
                  '
            - *id001
            - if: "{{\n  \"backup\" in input_notification_select_notifications or\n
                \ \"errors\" in input_notification_select_notifications\n}}"
              then:
              - *id003
            - alias: Выполнить пользовательские действия ошибки (тайм-аут резервного копирования)
              continue_on_error: true
              sequence: !input notification_action_errors
            else:
            - variables:
                log_message: Резервное копирование успешно завершено
            - *id001
            - if: '{{ "backup" in input_notification_select_notifications }}'
              then:
              - *id003
            - alias: Выполнить пользовательские действия резервного копирования (завершение)
              continue_on_error: true
              sequence: !input notification_action_backup
        else:
        - variables:
            log_message: 'Резервное копирование запущено.
              Датчик состояния резервного копирования не настроен, ожидание
              {{ input_backup_timeout | int(60) }} минут...
              '
        - *id001
        - alias: Ожидать резервное копирование (резервная задержка)
          delay:
            minutes: '{{ input_backup_timeout | int(60) }}'
        - variables:
            log_message: Время ожидания резервного копирования истекло. Продолжение...
        - *id001
        - if: '{{ "backup" in input_notification_select_notifications }}'
          then:
          - *id003
        - alias: Выполнить пользовательские действия резервного копирования (резервное ожидание завершено)
          continue_on_error: true
          sequence: !input notification_action_backup
- alias: Общие обновления
  if:
  - '{{ is_there_anything_to_update }}'
  - condition: or
    conditions:
    - condition: template
      value_template: '{{ is_out_of_schedule_mode }}'
    - condition: state
      entity_id: !input schedule_entity
      state: 'on'
  then:
  - *id002
  - variables:
      log_message: Элементы общих обновлений
  - *id001
  - variables:
      log_message: Запуск последовательности стандартных обновлений...
  - *id001
  - if: '{{ "update_progress" in input_notification_select_notifications }}'
    then:
    - *id003
  - alias: Обновление — Общее
    continue_on_error: true
    repeat:
      while:
      - '{{ input_general_update_mode in [''patches'', ''major_and_minor'', ''all'']
        }}'
      - condition: or
        conditions:
        - condition: template
          value_template: '{{ is_out_of_schedule_mode }}'
        - condition: state
          entity_id: !input schedule_entity
          state: 'on'
      - condition: template
        value_template: "{{ ( states.update\n  | selectattr('state', 'eq', 'on')\n
          \ | selectattr('entity_id', 'in', updates_pending)\n  | rejectattr('entity_id',
          'in', core_update_entity)\n  | rejectattr('entity_id', 'in', os_update_entity)\n
          \ | rejectattr('entity_id', 'in', firmware_update_entities)\n  | rejectattr('entity_id',
          'in', input_update_exclusions)\n  | map(attribute='entity_id')\n  | list
          | count | int(0) ) > 0\n}}\n"
      sequence:
      - variables:
          updates_pending: "{{ states.update\n  | selectattr('state', 'eq', 'on')\n
            \ | selectattr('entity_id', 'in', updates_pending)\n  | rejectattr('entity_id',
            'in', core_update_entity)\n  | rejectattr('entity_id', 'in', os_update_entity)\n
            \ | rejectattr('entity_id', 'in', firmware_update_entities)\n  | rejectattr('entity_id',
            'in', input_update_exclusions)\n  | map(attribute='entity_id')\n  | list\n}}\n"
      - &id005
        variables:
          current_update_entity: '{{ updates_pending[0] }}'
          current_update_entity_friendly_name: '{{ state_attr(current_update_entity,
            "friendly_name") | default(current_update_entity) }}

            '
      - &id006
        alias: Записать обновление в журнал
        sequence:
        - variables:
            log_message: Обновление "{{ current_update_entity_friendly_name }}"...
        - *id001
        - if: '{{ "update_progress" in input_notification_select_notifications }}'
          then:
          - *id003
        - alias: Выполнить пользовательские действия хода обновления
          continue_on_error: true
          sequence: !input notification_action_update_progress
      - &id007
        alias: Обновление — Установка
        continue_on_error: true
        action: update.install
        data: {}
        target:
          entity_id: '{{ current_update_entity }}'
      - &id008
        alias: Обновление — Ожидание
        sequence:
        - alias: Ожидание
          continue_on_error: true
          wait_template: '{{ is_state(current_update_entity, "off") }}'
          continue_on_timeout: true
          timeout: !input update_timeout
        - if: '{{ wait.completed }}'
          then:
          - variables:
              log_message: '"{{ current_update_entity_friendly_name }}" успешно обновлено'
          - *id001
          - if: '{{ "update_progress" in input_notification_select_notifications }}'
            then:
            - *id003
          - alias: Выполнить пользовательские действия хода обновления (успешно)
            continue_on_error: true
            sequence: !input notification_action_update_progress
          else:
          - variables:
              log_message: 'ОШИБКА: время ожидания обновления
                 "{{current_update_entity_friendly_name }}" истекло'
          - *id001
          - if: "{{\n  \"update_progress\" in input_notification_select_notifications
              or\n  \"errors\" in input_notification_select_notifications\n}}"
            then:
            - *id003
          - alias: Выполнить пользовательские действия ошибки (тайм-аут обновления)
            continue_on_error: true
            sequence: !input notification_action_errors
- alias: Прошивка устройств
  if:
  - '{{ is_there_anything_to_update }}'
  - condition: or
    conditions:
    - condition: template
      value_template: '{{ is_out_of_schedule_mode }}'
    - condition: state
      entity_id: !input schedule_entity
      state: 'on'
  then:
  - *id002
  - variables:
      log_message: Прошивка устройства
  - *id001
  - variables:
      log_message: Запуск последовательности обновления прошивки устройств
  - *id001
  - if: '{{ "update_progress" in input_notification_select_notifications }}'
    then:
    - *id003
  - alias: Обновление — Прошивка устройств
    continue_on_error: true
    repeat:
      while:
      - '{{ input_firmware_update_mode in [''patches'', ''major_and_minor'', ''all'']
        }}'
      - condition: or
        conditions:
        - condition: template
          value_template: '{{ is_out_of_schedule_mode }}'
        - condition: state
          entity_id: !input schedule_entity
          state: 'on'
      - condition: template
        value_template: "{{ ( states.update\n  | selectattr('state', 'eq', 'on')\n
          \ | selectattr('entity_id', 'in', firmware_update_entities)\n  | rejectattr('entity_id',
          'in', input_update_exclusions)\n  | map(attribute='entity_id')\n  | list
          | count | int(0) ) > 0\n}}\n"
      sequence:
      - variables:
          updates_pending: "{{ states.update\n  | selectattr('state', 'eq', 'on')\n
            \ | selectattr('entity_id', 'in', firmware_update_entities)\n  | map(attribute='entity_id')\n
            \ | list\n}}\n"
      - *id005
      - *id006
      - *id007
      - *id008
