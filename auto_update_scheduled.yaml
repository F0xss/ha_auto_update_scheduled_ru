    - condition: template
      value_template: '{{ is_out_of_schedule_mode }}'
    - condition: state
      entity_id: !input schedule_entity
      state: 'on'
  then:
  - *id002
  - variables:
      log_message: Обновление ядра
  - *id001
  - variables:
      log_message: Запуск последовательности обновлений элементов ядра...
  - *id001
  - if: '{{ "update_progress" in input_notification_select_notifications }}'
    then:
    - *id003
  - alias: Обновление — Ядро
    continue_on_error: true
    repeat:
      while:
      - '{{ input_core_os_update_mode in [''patches'', ''major_and_minor'', ''all'']
        }}'
      - condition: or
        conditions:
        - condition: template
          value_template: '{{ is_out_of_schedule_mode }}'
        - condition: state
          entity_id: !input schedule_entity
          state: 'on'
      - condition: template
        value_template: "{{ ( states.update\n  | selectattr('state', 'eq', 'on')\n
          \ | selectattr('entity_id', 'in', core_update_entity)\n  | rejectattr('entity_id',
          'in', input_update_exclusions)\n  | map(attribute='entity_id')\n  | list
          | count | int(0) ) > 0\n}}\n"
      sequence:
      - variables:
          updates_pending: "{{ states.update\n  | selectattr('state', 'eq', 'on')\n
            \ | selectattr('entity_id', 'in', core_update_entity)\n  | rejectattr('entity_id',
            'in', input_update_exclusions)\n  | map(attribute='entity_id')\n  | list\n}}\n"
      - *id005
      - *id006
      - *id007
      - *id008
- alias: Обновление ОС
  if:
  - '{{ is_there_anything_to_update }}'
  - condition: or
    conditions:
    - condition: template
      value_template: '{{ is_out_of_schedule_mode }}'
    - condition: state
      entity_id: !input schedule_entity
      state: 'on'
  then:
  - *id002
  - variables:
      log_message: Обновление ОС
  - *id001
  - variables:
      log_message: Запуск последовательности обновления ОС
  - *id001
  - if: '{{ "update_progress" in input_notification_select_notifications }}'
    then:
    - *id003
  - alias: Обновление — ОС
    continue_on_error: true
    repeat:
      while:
      - '{{ input_core_os_update_mode in [''patches'', ''major_and_minor'', ''all'']
        }}'
      - condition: or
        conditions:
        - condition: template
          value_template: '{{ is_out_of_schedule_mode }}'
        - condition: state
          entity_id: !input schedule_entity
          state: 'on'
      - condition: template
        value_template: "{{ ( states.update\n  | selectattr('state', 'eq', 'on')\n
          \ | selectattr('entity_id', 'in', os_update_entity)\n  | rejectattr('entity_id',
          'in', input_update_exclusions)\n  | map(attribute='entity_id')\n  | list
          | count | int(0) ) > 0\n}}\n"
      sequence:
      - variables:
          updates_pending: "{{ states.update\n  | selectattr('state', 'eq', 'on')\n
            \ | selectattr('entity_id', 'in', os_update_entity)\n  | rejectattr('entity_id',
            'in', input_update_exclusions)\n  | map(attribute='entity_id')\n  | list\n}}\n"
      - *id005
      - *id006
      - *id007
      - *id008
- alias: Обновление — Оставшиеся
  continue_on_error: true
  if:
  - '{{ is_there_anything_to_update }}'
  - condition: or
    conditions:
    - condition: template
      value_template: '{{ is_out_of_schedule_mode }}'
    - condition: state
      entity_id: !input schedule_entity
      state: 'on'
  then:
  - *id002
  - variables:
      log_message: Обновление всех оставшихся элементов (если есть)
  - *id001
  - variables:
      remaining_items: '{{ states.update

        | selectattr(''state'', ''eq'', ''on'')

        | selectattr(''entity_id'', ''in'', updates_pending)

        | rejectattr(''entity_id'', ''in'', input_update_exclusions)

        | map(attribute=''entity_id'')

        | list

        }}

        '
      remaining_items_count: '{{ remaining_items | count if remaining_items is sequence
        else 0 }}'
  - condition: '{{ remaining_items_count > 0 }}'
  - variables:
      log_message: 'Оставшиеся обновления:

        - {{ remaining_items | join("\n- ") }}

        '
  - *id001
  - if: '{{ "update_progress" in input_notification_select_notifications }}'
    then:
    - *id003
  - alias: Обновление — Оставшиеся — Установка
    continue_on_error: true
    service: update.install
    data: {}
    target:
      entity_id: '{{ states.update | selectattr(''state'', ''eq'', ''on'') | selectattr(''entity_id'',
        ''in'', updates_pending) | rejectattr(''entity_id'', ''in'', input_update_exclusions)
        | map(attribute=''entity_id'') | list }}'
  - alias: Обновление — Оставшиеся — Ожидание
    continue_on_error: true
    wait_template: "{{\n  (\n    states.update\n    | selectattr('state', 'eq', 'on')\n
      \   | selectattr('entity_id', 'in', updates_pending)\n    | rejectattr('entity_id',
      'in', input_update_exclusions)\n    | list\n    | count\n    | int(0)\n  ) <
      1\n}}"
    continue_on_timeout: true
    timeout: !input update_timeout
- alias: Завершение
  if:
  - '{{ is_there_anything_to_update }}'
  - condition: or
    conditions:
    - condition: template
      value_template: '{{ is_out_of_schedule_mode }}'
    - condition: state
      entity_id: !input schedule_entity
      state: 'on'
  then:
  - *id002
  - variables:
      log_message: Завершение процесса обновления
  - *id001
  - variables:
      remaining_updates: "{{\n  states.update\n  | selectattr('state', 'eq', 'on')\n
        \ | selectattr('entity_id', 'in', updates_pending)\n  | rejectattr('entity_id',
        'in', input_update_exclusions)\n  | map(attribute='name')\n  | list\n}}\n"
      remaining_updates_count: '{{ remaining_updates | count | int(0) }}'
  - if: '{{ remaining_updates_count > 0 }}'
    then:
    - variables:
        log_message: 'Оставшиеся обновления:

          - {{remaining_updates | join("\n- ") }}

          '
    - *id001
    - if: "{{\n  \"done\" in input_notification_select_notifications or\n  \"errors\"
        in input_notification_select_notifications\n}}"
      then:
      - *id003
    - alias: Выполнить пользовательские действия ошибки (оставшиеся обновления)
      continue_on_error: true
      sequence: !input notification_action_errors
    else:
    - variables:
        log_message: Нет оставшихся элементов для обновления
    - *id001
- alias: Перезапуск
  sequence:
  - variables:
      input_restart_type: !input restart_type
  - condition: '{{ input_restart_type != "no-restart" }}'
  - alias: Ожидать завершения ожидающих операций
    continue_on_error: true
    wait_template: "{{\n  (\n    states.update\n    | rejectattr('state', 'eq', 'off')\n
      \   | rejectattr('entity_id', 'in', input_update_exclusions)\n    | map(attribute='entity_id')\n
      \   | list | count | int(0)\n  ) < 1\n}}\n"
    continue_on_timeout: true
    timeout:
      seconds: 30
  - variables:
      pending_restart_items: "{{ states.update\n  | selectattr('attributes.release_summary',
        'defined')\n  | selectattr('attributes.release_summary', 'search', \"<ha-alert
        alert-type='error'>\")\n  | map(attribute='name')\n  | list\n}}\n"
      pending_restart_items_count: '{{ pending_restart_items | count | int(0) }}'
  - if: '{{ pending_restart_items_count < 1 }}'
    then:
    - variables:
        log_message: Нет элементов, требующих перезапуска
    - *id001
  - condition: '{{ pending_restart_items_count > 0 }}'
  - variables:
      log_message: '{{
        pending_restart_items_count}} элемент{{ "ов" if
        pending_restart_items_count > 1 }} требует перезапуска:
        - {{ pending_restart_items | join("\n- ") }}

        '
  - *id001
  - if: '{{ "restart" in input_notification_select_notifications }}'
    then:
    - *id003
  - alias: Выполнить пользовательские действия перезапуска
    continue_on_error: true
    sequence: !input notification_action_restart
  - alias: Перезапуск
    continue_on_error: true
    sequence:
    - condition: '{{ pending_restart_items_count > 0 }}'
    - alias: Перезапуск — Проверка конфигурации
      continue_on_error: true
      action: homeassistant.check_config
    - variables:
        has_invalid_config: "{{\n  states.persistent_notification.invalid_config.state\n
          \ | default('unavailable') == 'notifying'\n}}\n"
        has_check_config_notification: "{{\n  states.persistent_notification.homeassistant_check_config.state\n
          \ | default('unavailable') == 'notifying'\n}}\n"
    - if: '{{ has_invalid_config or has_check_config_notification }}'
      then:
      - variables:
          log_message: Выполнение действий перед перезапуском...
      - *id001
      - if: '{{ "restart" in input_notification_select_notifications }}'
        then:
        - *id003
      - alias: Выполнить действия перед перезапуском
        continue_on_error: true
        sequence: !input actions_pre_restart
      - variables:
          log_message: "Пропуск процесса перезапуска из-за уведомлений о некорректной
            конфигурации:\n\n  - has_invalid_config = {{ has_invalid_config
            }}\n\n  - has_check_config_notification = {{ has_check_config_notification }}\n"
      - *id001
      - if: '{{ "restart" in input_notification_select_notifications }}'
        then:
        - *id003
      else:
      - variables:
          log_message: 'Система настроена на автоматический перезапуск, когда
            этого требует обновление. Перезапуск

            Home Assistant ({{ input_restart_type }})...'

            '
      - *id001
      - if: '{{ "restart" in input_notification_select_notifications }}'
        then:
        - *id003
      - alias: Подождать 15 секунд для доставки сообщения уведомления.
        delay:
          seconds: 15
      - alias: Перезапуск — Вызов службы перезагрузки
        continue_on_error: true
        action: '{{ "hassio.host_reboot" if input_restart_type == "host" else "homeassistant.restart"
          }}'
- alias: Действия после обновления
  sequence:
  - variables:
      input_actions_pos_update: !input actions_pos_update
  - condition: '{{ input_actions_pos_update is sequence }}'
  - variables:
      log_message: Выполнение действий после обновления
  - *id001
  - alias: Выполнить действия после обновления
    continue_on_error: true
    sequence: !input actions_pos_update
- alias: Установить флаг вспомогательной сущности в OFF
  if:
  - '{{ input_update_process_started_entity | default([]) | count > 0 }}'
  - '{{ input_update_process_started_entity[0] | string | length > 0 }}'
  then:
  - action: input_boolean.turn_off
    target:
      entity_id: !input update_process_started_entity
    continue_on_error: true
- alias: Завершено
  if:
  - '{{ is_there_anything_to_update }}'
  - condition: or
    conditions:
    - condition: template
      value_template: '{{ is_out_of_schedule_mode }}'
    - condition: state
      entity_id: !input schedule_entity
      state: 'on'
  then:
  - variables:
      log_message: Готово!
  - *id001
  - if: '{{ "done" in input_notification_select_notifications }}'
    then:
    - *id003
  - alias: Выполнить пользовательские действия завершения
    continue_on_error: true
    sequence: !input notification_action_done
